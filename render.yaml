services:
  - type: web
    name: congo-brain
    runtime: docker
    repo: https://github.com/YazzBongoy/Congo-Brain
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: congo-brain-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ANOMALY_THRESHOLD
        value: "0.7"
      - key: RISK_SCORE_THRESHOLD
        value: "75.0"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
    healthCheckPath: /health
    autoDeploy: true

  - type: pgsql
    name: congo-brain-db
    databaseName: congo_brain
    plan: starter

services:
  - type: web
    name: congo-brain
    runtime: docker
    repo: https://github.com/YazzBongoy/Congo-Brain
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: congo-brain-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: KEYCLOAK_ENABLED
        value: "true"
      - key: KEYCLOAK_SERVER_URL
        sync: false
      - key: KEYCLOAK_CLIENT_SECRET
        sync: false
      - key: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      - key: KEYCLOAK_FRONTEND_URL
        sync: false
      - key: KEYCLOAK_API_URL
        sync: false
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "false"
      - key: KEYCLOAK_REALM
        value: congo-brain
      - key: KEYCLOAK_CLIENT_ID
        value: congo-brain-api
      - key: ANOMALY_THRESHOLD
        value: "0.7"
      - key: RISK_SCORE_THRESHOLD
        value: "75.0"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
    preDeployCommand: alembic upgrade head && bash scripts/keycloak-init.sh
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: congo-brain-db
    databaseName: congo_brain
    plan: starter

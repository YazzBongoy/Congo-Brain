{{- if not .Values.appSecret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "congo-brain.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ required "appSecret.key is required when appSecret.existingSecret is not set" .Values.appSecret.key | quote }}
  database-url: {{ required "database.url is required when database.existingSecret is not set" .Values.database.url | quote }}
{{- end }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "congo-brain.appName" . }}-migrate
  labels:
    {{- include "congo-brain.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "congo-brain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: alembic
          image: {{ include "congo-brain.image" .Values.image.app | quote }}
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "appSecret.existingSecret is required" .Values.appSecret.existingSecret }}
                  key: secret-key
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | quote }}
            - name: KEYCLOAK_ENABLED
              value: {{ .Values.env.KEYCLOAK_ENABLED | quote }}
            {{- if eq (toString .Values.env.KEYCLOAK_ENABLED) "true" }}
            - name: KEYCLOAK_SERVER_URL
              value: {{ required "env.KEYCLOAK_SERVER_URL is required when Keycloak is enabled" .Values.env.KEYCLOAK_SERVER_URL | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

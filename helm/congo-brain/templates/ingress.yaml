{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "congo-brain.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .component "app" }}
                name: {{ include "congo-brain.appName" $ }}
                port:
                  number: {{ $.Values.service.app.port }}
                {{- else if eq .component "frontend" }}
                name: {{ include "congo-brain.frontendName" $ }}
                port:
                  number: {{ $.Values.service.frontend.port }}
                {{- else }}
                {{- fail "ingress path component must be app or frontend" }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

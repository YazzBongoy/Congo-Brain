apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "congo-brain.appName" . }}
  labels:
    {{- include "congo-brain.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount.app }}
  selector:
    matchLabels:
      {{- include "congo-brain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "congo-brain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          image: {{ include "congo-brain.image" .Values.image.app | quote }}
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "appSecret.existingSecret is required" .Values.appSecret.existingSecret }}
                  key: secret-key
            - name: KEYCLOAK_ENABLED
              value: {{ .Values.env.KEYCLOAK_ENABLED | quote }}
            {{- if eq (toString .Values.env.KEYCLOAK_ENABLED) "true" }}
            - name: KEYCLOAK_SERVER_URL
              value: {{ required "env.KEYCLOAK_SERVER_URL is required when Keycloak is enabled" .Values.env.KEYCLOAK_SERVER_URL | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.env.KEYCLOAK_REALM | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.env.KEYCLOAK_CLIENT_ID | quote }}
            {{- end }}
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | quote }}
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}

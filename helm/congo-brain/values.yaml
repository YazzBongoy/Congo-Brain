# GEOS Helm Chart — Default Values

replicaCount:
  app: 2
  frontend: 2

image:
  app:
    repository: ghcr.io/yazzbongoy/congo-brain
    tag: ""
    digest: ""
    pullPolicy: Always
  frontend:
    repository: ghcr.io/yazzbongoy/congo-brain-frontend
    tag: ""
    digest: ""
    pullPolicy: Always

service:
  app:
    type: ClusterIP
    port: 8000
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: geos.local
      paths:
        - path: /api
          pathType: Prefix
          component: app
        - path: /
          pathType: Prefix
          component: frontend
  tls: []

env:
  KEYCLOAK_ENABLED: "true"
  KEYCLOAK_SERVER_URL: ""
  KEYCLOAK_REALM: "congo-brain"
  KEYCLOAK_CLIENT_ID: "congo-brain-api"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_FRONTEND_URL: ""
  KEYCLOAK_API_URL: ""
  ENVIRONMENT: "production"

appSecret:
  existingSecret: ""

# Pre-created Secret keys: keycloak-admin-password, keycloak-client-secret,
# and optionally confirm-remove-legacy-admin=REMOVE after explicit approval.
identitySecret:
  existingSecret: ""

database:
  existingSecret: ""

resources:
  app:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

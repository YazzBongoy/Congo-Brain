name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: congo_brain_test
          POSTGRES_USER: congo
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U congo -d congo_brain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check congo_brain/ alembic/ tests/

      - name: Type check
        run: mypy congo_brain/ --ignore-missing-imports

      - name: Unit and API tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/ -v --tb=short

      - name: PostgreSQL migration round-trip
        env:
          DATABASE_URL: postgresql+psycopg2://congo:test@localhost:5432/congo_brain_test
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: PostgreSQL audit integrity and concurrency
        env:
          POSTGRES_TEST_URL: postgresql+psycopg2://congo:test@localhost:5432/congo_brain_test
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/test_postgres_audit_integration.py -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint Helm chart
        run: helm lint helm/congo-brain --strict

      - name: Render Kubernetes manifests
        # The chart guards KEYCLOAK_SERVER_URL with `required` (fail-fast, intentional:
        # a production render must never ship an empty IdP URL). Render with a
        # non-secret placeholder so the templates are still exercised in CI.
        run: helm template congo-brain helm/congo-brain --set env.KEYCLOAK_SERVER_URL=https://keycloak.invalid/realms/congo-brain

      - name: Verify the Keycloak guard rejects an empty server URL
        run: |
          set -euo pipefail
          if helm template congo-brain helm/congo-brain > /dev/null 2>&1; then
            echo "::error::chart rendered with an empty KEYCLOAK_SERVER_URL; the required guard is broken"
            exit 1
          fi
          echo "Keycloak required guard OK: empty server URL is rejected"

      - name: Version coherence across release surfaces
        run: |
          set -euo pipefail
          app_version=$(grep -oP '(?<=^__version__ = ")[^"]+' congo_brain/__init__.py)
          chart_version=$(grep -oP '(?<=^appVersion: ")[^"]+' helm/congo-brain/Chart.yaml)
          py_version=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)

          if [ "$app_version" != "$chart_version" ]; then
            echo "::error::appVersion ($chart_version) != __version__ ($app_version)"
            exit 1
          fi
          if [ "$py_version" != "$app_version" ]; then
            echo "::error::pyproject version ($py_version) != __version__ ($app_version)"
            exit 1
          fi
          echo "Version coherence OK: $app_version"

      - name: Render deployment config consistency
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys
          import yaml

          compose = yaml.safe_load(pathlib.Path("docker-compose.yml").read_text())
          services = compose.get("services", {})
          required = {"app", "postgres", "keycloak"}
          missing = required - set(services)
          if missing:
              print(f"::error::docker-compose.yml missing services: {sorted(missing)}", file=sys.stderr)
              sys.exit(1)
          print(f"docker-compose services OK: {sorted(required)}")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend, release-config]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

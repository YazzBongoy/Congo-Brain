name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: congo_brain_test
          POSTGRES_USER: congo
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U congo -d congo_brain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: ruff check congo_brain/ alembic/ tests/

      - name: Compile and import smoke tests
        run: |
          python -m compileall -q congo_brain alembic
          pytest tests/test_package_imports.py -v --tb=short

      - name: Type check
        run: mypy congo_brain/

      - name: Unit and API tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/ -v --tb=short --ignore=tests/test_postgres_audit_integration.py

      - name: PostgreSQL migration round-trip
        env:
          DATABASE_URL: postgresql+psycopg2://congo:test@localhost:5432/congo_brain_test
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: PostgreSQL audit integrity and concurrency
        env:
          POSTGRES_TEST_URL: postgresql+psycopg2://congo:test@localhost:5432/congo_brain_test
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/test_postgres_audit_integration.py -v --tb=short

      - name: PostgreSQL backup and restore drill
        env:
          SOURCE_DSN: postgresql://congo:test@localhost:5432/congo_brain_test
          RESTORE_DSN: postgresql://congo:test@localhost:5432/congo_brain_restore
          PGPASSWORD: test
          RESTORE_DB: congo_brain_restore
        run: |
          set -euo pipefail
          pg_dump --version
          backup_dir="$(mktemp -d)"
          trap 'dropdb --if-exists -h localhost -p 5432 -U congo "$RESTORE_DB"; rm -rf "$backup_dir"' EXIT
          PG_DSN="$SOURCE_DSN" BACKUP_DIR="$backup_dir" BACKUP_NAME=congo_brain scripts/backup_postgres.sh
          backup_file="$(printf '%s\n' "$backup_dir"/*.dump)"
          createdb -h localhost -p 5432 -U congo "$RESTORE_DB"
          PG_DSN="$RESTORE_DSN" BACKUP_FILE="$backup_file" CONFIRM_RESTORE=RESTORE scripts/restore_postgres.sh
          test "$(psql "$RESTORE_DSN" -Atqc 'SELECT version_num FROM alembic_version')" = "a93d8e71c4b2"

      - name: Real Keycloak role and token integration
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-admin-password
          KEYCLOAK_CLIENT_SECRET: ci-keycloak-client-secret
        run: |
          set -euo pipefail
          container=congo-brain-keycloak-ci
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -p 18080:8080 \
            -e KEYCLOAK_ADMIN -e KEYCLOAK_ADMIN_PASSWORD -e KC_HEALTH_ENABLED=true \
            quay.io/keycloak/keycloak@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9 \
            start-dev
          for attempt in $(seq 1 90); do
            if test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health/ready || true)" = 200; then
              break
            fi
            test "$attempt" -lt 90 || { docker logs "$container"; exit 1; }
            sleep 2
          done
          KEYCLOAK_URL=http://localhost:18080 bash scripts/keycloak-init.sh
          KEYCLOAK_TEST_URL=http://localhost:18080 \
            KEYCLOAK_SERVER_URL=http://localhost:18080 \
            KEYCLOAK_ENABLED=true \
            pytest tests/test_keycloak_real_integration.py -v --tb=short

      - name: Python dependency audit
        run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh docker/postgres/init/*.sh
          shellcheck scripts/*.sh docker/postgres/init/*.sh
      - name: Validate Docker Compose
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example config --format json > /tmp/compose.json
          python - <<'PY'
          import json
          services = json.load(open("/tmp/compose.json", encoding="utf-8"))["services"]
          assert services["migrate"]["command"] == ["alembic", "upgrade", "head"]
          assert services["app"]["depends_on"]["migrate"]["condition"] == "service_completed_successfully"
          assert services["app"]["depends_on"]["keycloak-init"]["condition"] == "service_completed_successfully"
          assert services["keycloak-init"]["command"] == ["bash", "scripts/keycloak-init.sh"]
          PY
      - name: Validate Render Blueprint structure
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          blueprint = yaml.safe_load(open("render.yaml", encoding="utf-8"))
          assert blueprint.get("services"), "Render services are required"
          assert blueprint.get("databases"), "Render databases must be top-level"
          assert all(service.get("type") != "pgsql" for service in blueprint["services"])
          PY
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Lint and render Helm with a non-default release name
        run: |
          values=(
            --set appSecret.existingSecret=ws2-app
            --set database.existingSecret=ws2-db
            --set identitySecret.existingSecret=ws2-identity
            --set "image.app.tag=sha-${GITHUB_SHA}"
            --set "image.frontend.tag=sha-${GITHUB_SHA}"
            --set env.KEYCLOAK_SERVER_URL=https://keycloak.example.invalid
            --set env.KEYCLOAK_FRONTEND_URL=https://app.example.invalid
            --set env.KEYCLOAK_API_URL=https://api.example.invalid
          )
          helm lint helm/congo-brain "${values[@]}"
          helm template ws2-validation helm/congo-brain "${values[@]}" > /tmp/helm.yaml
          python - <<'PY'
          import os
          import subprocess
          import sys
          import yaml

          documents = list(yaml.safe_load_all(open("/tmp/helm.yaml", encoding="utf-8")))
          migration = next(
              document
              for document in documents
              if document
              and document.get("kind") == "Job"
              and document.get("metadata", {}).get("labels", {}).get("app.kubernetes.io/component") == "migration"
          )
          identity = next(
              document
              for document in documents
              if document
              and document.get("kind") == "Job"
              and document.get("metadata", {}).get("labels", {}).get("app.kubernetes.io/component") == "keycloak-init"
          )
          assert identity["metadata"]["annotations"]["helm.sh/hook-weight"] == "-10"
          identity_container = identity["spec"]["template"]["spec"]["containers"][0]
          assert identity_container["command"] == ["bash", "scripts/keycloak-init.sh"]
          identity_env = {entry["name"]: entry for entry in identity_container["env"]}
          assert identity_env["KEYCLOAK_URL"]["value"] == "https://keycloak.example.invalid"
          assert identity_env["KEYCLOAK_DIRECT_GRANTS_ENABLED"]["value"] == "false"
          assert identity_env["KEYCLOAK_ADMIN_PASSWORD"]["valueFrom"]["secretKeyRef"]["name"] == "ws2-identity"
          assert identity_env["KEYCLOAK_CLIENT_SECRET"]["valueFrom"]["secretKeyRef"]["name"] == "ws2-identity"
          entries = migration["spec"]["template"]["spec"]["containers"][0]["env"]
          rendered_env = {entry["name"]: entry["value"] for entry in entries if "value" in entry}
          assert rendered_env["ENVIRONMENT"] == "production"
          assert rendered_env["KEYCLOAK_ENABLED"] == "true"
          assert rendered_env["KEYCLOAK_SERVER_URL"] == "https://keycloak.example.invalid"
          process_env = os.environ | rendered_env | {"SECRET_KEY": "helm-release-gate-secret"}
          subprocess.run(
              [sys.executable, "-c", "import congo_brain.core.config"],
              env=process_env,
              check=True,
          )
          PY
          grep -q 'name: ws2-validation-app' /tmp/helm.yaml
          grep -q 'name: ws2-validation-frontend' /tmp/helm.yaml
          grep -q '"helm.sh/hook": pre-install,pre-upgrade' /tmp/helm.yaml
          grep -q 'name: KEYCLOAK_ENABLED' /tmp/helm.yaml
          if helm template insecure helm/congo-brain \
            --set appSecret.existingSecret=ws2-app \
            --set database.existingSecret=ws2-db \
            --set identitySecret.existingSecret=ws2-identity \
            --set "image.app.tag=sha-${GITHUB_SHA}" \
            --set "image.frontend.tag=sha-${GITHUB_SHA}" \
            --set env.KEYCLOAK_SERVER_URL=http://keycloak.example.invalid \
            --set env.KEYCLOAK_FRONTEND_URL=https://app.example.invalid \
            --set env.KEYCLOAK_API_URL=https://api.example.invalid >/dev/null 2>&1; then
            echo 'Production Helm must reject an HTTP Keycloak URL' >&2
            exit 1
          fi
          if helm template mutable helm/congo-brain \
            --set appSecret.existingSecret=ws2-app \
            --set database.existingSecret=ws2-db \
            --set identitySecret.existingSecret=ws2-identity \
            --set image.app.tag=latest \
            --set image.frontend.tag=latest \
            --set env.KEYCLOAK_SERVER_URL=https://keycloak.example.invalid \
            --set env.KEYCLOAK_FRONTEND_URL=https://app.example.invalid \
            --set env.KEYCLOAK_API_URL=https://api.example.invalid >/dev/null 2>&1; then
            echo 'Mutable image tags must be rejected' >&2
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, frontend, release-config]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/yazzbongoy/congo-brain:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/yazzbongoy/congo-brain-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

[tool.poetry]
name = "congo-brain"
version = "1.0.0"
description = "Congo-Brain — Plateforme IA de gouvernance pour la RDC"
readme = "README.md"
license = "MIT"
packages = [{include = "congo_brain"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
typer = ">=0.9.0"
rich = ">=13.0.0"
fastapi = ">=0.110.0"
uvicorn = {version = ">=0.27.0", extras = ["standard"]}
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
sqlalchemy = ">=2.0.0"
PyJWT = {version = ">=2.10.0", extras = ["crypto"]}
bcrypt = ">=4.0.0"
alembic = ">=1.13.0"
psycopg2-binary = ">=2.9.9"
slowapi = ">=0.1.9"
email-validator = ">=2.0.0"
scipy = ">=1.11.0"
requests = ">=2.31.0"
prometheus-client = ">=0.20.0"
fpdf2 = ">=2.8.0"
openpyxl = ">=3.1.0"
strawberry-graphql = {version = ">=0.227.0", extras = ["fastapi"]}

[tool.poetry.scripts]
congo-brain = "congo_brain.cli.app:app"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.3.0"
mypy = ">=1.8.0"
pytest = ">=8.0.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "congo_brain.models.geos.entities"
disable_error_code = ["return-value", "no-any-return"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
